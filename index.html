<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    background:radial-gradient(circle at top,#111,#000);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#fff;
}

/* MAIN CARD CONTAINER */
.container{
    max-width:420px;
    width:100%;
    background:linear-gradient(180deg,#151515,#0a0a0a);
    border-radius:26px;
    padding:30px 22px;
    box-shadow:0 25px 60px rgba(0,0,0,0.9);
    border: 1px solid rgba(255,255,255,0.05);
}

/* PROFILE SECTION */
.profile{
    text-align:center;
}
.profile img{
    width:120px;
    height:120px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg,#f5c400,#ffef9f);
    object-fit:cover;
    display:block;
    margin:auto;
}
.name{
    margin-top:16px;
    font-size:27px;
    font-weight:700;
    background:linear-gradient(90deg,#f5c400,#fff2b0);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.crowns{
    display:flex;
    justify-content:space-between;
    padding:0 42px;
    margin-top:-12px;
}
.crowns span{
    font-size:22px;
    color:#f5c400;
}
.trust{
    margin-top:8px;
    font-size:14px;
    color:#d9d9d9;
}
.trust span{
    color:#2ecc71;
    font-weight:700;
}

/* COUNTER & BADGES */
.counter{
    margin:16px 0;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    padding:12px;
    border-radius:14px;
    text-align:center;
}
.counter b{
    color:#2ecc71;
    font-size:20px;
}
.badges{
    display:flex;
    gap:12px;
    justify-content:center;
    margin:18px 0;
}
.badge{
    background:rgba(255,255,255,0.06);
    padding:9px 16px;
    border-radius:14px;
    font-size:13px;
}

/* --- THE REQUESTED WRAPPER ON BUTTON --- */
.wrapper {
    margin: 26px 0;
    padding: 3px; /* Border thickness */
    border-radius: 35px; /* Matches button roundness */
    background: linear-gradient(120deg,#f5c400,#fff1a8,#f5c400);
    background-size: 300% 300%;
    animation: borderMove 4s linear infinite;
    position: relative;
    display: block;
}

@keyframes borderMove{
    0%{background-position:0% 50%}
    100%{background-position:100% 50%}
}

.telegram-btn-link {
    display: block;
    background: linear-gradient(90deg,#007bff,#00c6ff);
    padding: 17px;
    text-align: center;
    border-radius: 32px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    position: relative;
    overflow: hidden;
    animation: heartbeat 2.2s infinite;
}

@keyframes heartbeat{
    0%{transform:scale(1);}
    50%{transform:scale(1.02);}
    100%{transform:scale(1);}
}

/* PLUS ICON INSIDE BUTTON */
.plus{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border-radius:50%;
    background:#00c6ff;
    color:#fff;
    font-size:22px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 15px rgba(0,198,255,0.9);
}
.plus::after{
    content:"";
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:2px solid rgba(0,198,255,0.7);
    animation:pulse 1.6s infinite;
}
@keyframes pulse{
    0%{transform:scale(0.7);opacity:1;}
    100%{transform:scale(1.4);opacity:0;}
}

/* FEATURES */
.features{
    margin-top:20px;
}
.feature{
    background:rgba(255,255,255,0.05);
    padding:15px;
    border-radius:16px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
    border:1px solid rgba(255,255,255,0.08);
}
.feature span{
    color:#2ecc71;
    font-size:19px;
}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:15px;
    font-weight:600;
    background:linear-gradient(90deg,#00f2fe,#4facfe);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* CREDIT */
.credit{
    position:fixed;
    bottom:10px;
    left:0;
    width:100%;
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#ffd88a;
    z-index:9999;
}
.credit a{
    color:#cfa44a;
    text-decoration:none;
}
</style>
